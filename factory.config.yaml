# factory.config.yaml — generated by installer v2.40, allineato a PATTERN v2.42
# Soli Multi-Agents Factory  PATTERN v2.42
# Project: poc-hagenthon-2026
#
# Reference: PATTERN.md §13 topology  §15 VCS  §17 publisher
#            §18 scheduler  §19 code-quality  §20 compression  §24 design-intelligence
#            §27 prototype-generation  §28 tavola-rotonda  §29 scalability
#            §30 voice-channel  §31 hybrid-wiki-search  §34 semantic-purpose
#            §35 wiki-keeper-2.0  §35 sweep-reviews  §36 fleet-health  §37 session-analysis

pattern_version: "2.42"

# Adapters -----------------------------------------------------------------
adapters:
  - name: claude
    folder: .claude
    maturity: full

# Topology -----------------------------------------------------------------
topology: full-stack-agents

# Code paths ---------------------------------------------------------------
code_paths: []
code_path: "."
vcs:
  mode: monorepo
  branch_awareness:
    enabled: true
    preflight: true       # tabella /vcs-status nella dashboard /run
    dispatch_gate: warn   # off|warn|block — warn: segnala, non blocca il dispatch
    auto_align: off       # mai checkout silenzioso (R.B8)
    drift_check: true

# Stack --------------------------------------------------------------------
stack_mode: manual  # manual | guided | auto
stack:
  backend: ""
  frontend: ""
  database: ""
  qa: ""
  infra: ""

# Routing ------------------------------------------------------------------
routing:
  be: agent
  fe: agent
  db: agent
  qa: agent
  docs: agent

# Kanban publish -----------------------------------------------------------
kanban_publish:
  provider: none

# Parallel scheduler -------------------------------------------------------
scheduler:
  enabled: true
  max_parallel: 4
  parallel_gate_threshold: 3
  domains:
    prototype: false
    release: false    # v2.40 (EP-059)

# Code quality review ------------------------------------------------------
code_quality:
  enabled: true
  max_iterations: 3
  ruleset:
    evolve:
      enabled: false        # HARD DEP 1 — CQRL evolve richiede code_quality.enabled

# Compression layer --------------------------------------------------------
compression:
  output:
    enabled: false
    provider: caveman
    policy_profile: conservative
    decision_anchor:
      enabled: false        # HARD DEP 4 — richiede compression.output.enabled
    consistency_check:
      enabled: false        # HARD DEP 5 — richiede compression.output.enabled
  context:
    enabled: false
    provider: none
    mcp_server:
      enabled: false        # HARD DEP 6 — richiede compression.context.enabled

# Analytics ----------------------------------------------------------------
analytics:
  token_ledger:
    enabled: true
  measurement:
    agent: false
  estimation:
    agent: false
  sprint_progress:
    enabled: true
    velocity_rolling_days: 7

# Release Governance (v2.40, EP-059, opt-in) --------------------------------
release_governance:
  enabled: false
  min_run_reports: 3
  battle_test_gate:
    enabled: false

# Semantic drift detection (v2.23, EP-031) ----------------------------------
wiki_lint:
  semantic_check:
    enabled: false
    similarity_threshold: 0.75
    embedding_model: "voyage-3"
    cost_warn_usd: 1.0
    output_report: true
    output_report_path: "code_quality/reports/"

# Wiki Sweep semantico (v2.38, EP-056, opt-in) ------------------------------
wiki_sweep:
  enabled: true
  confidence_min: 0.7
  max_iterations: 3

# Ponytail Decision Ladder (v2.39, EP-057, opt-in) --------------------------
ponytail:
  enabled: true
  passes:
    yagni_ladder: true      # HARD DEP soddisfatta: code_quality.enabled: true
  lint:
    severity: warning
  audit:
    exclude_patterns: []

# Prototype Generation Layer (v2.26, EP-035, PATTERN §27) -------------------
prototyping:
  enabled: true
  backend: auto
  # figma/penpot esclusi: richiedono MCP server non configurati.
  # NB: finche' code_paths e' vuoto e non esiste un package.json, il probe react
  # risulta UNAVAILABLE e /prototype degrada a html (degrade_policy: notify).
  fallback_chain: [react, html]
  degrade_policy: notify
  fidelity: interactive
  design_source: auto
  art_director: inherit
  output_path: "output/prototypes"
  oracle_handoff: true
  scheduler_domain: prototype
  backends:
    html:
      css_strategy: tailwind-cdn
      single_file: true
    react:
      component_lib: shadcn
      storybook: true
      target: null
    figma:
      mcp_server: "figma"
      file_key: ""
    penpot:
      mcp_server: "penpot"
      instance_url: ""

# Tavola Rotonda (EP-039, PATTERN §28) --------------------------------------
tavola_rotonda:
  enabled: true
  partecipanti: []          # [] = selezione automatica per dominio del topic
  critico:
    enabled: true           # HARD DEP 15 soddisfatta: tavola_rotonda.enabled: true
    mode: dedicated
  max_round: 4
  stop_su_consenso: true
  definizione_consenso: unanimity
  meccanismo_decisione: ibrido
  budget:
    max_cost_usd: 5.0       # session cap (R.TR2) — deve essere numerico
    max_tokens: ~
    max_latency_s: ~
  topologia: lavagna
  sintesi_progressiva: true

# Voice Channel (v2.28 EP-041 + v2.31 EP-044, PATTERN §30) -----------------
voice_channel:
  enabled: false
  stt:
    model: medium
    device: cpu
    compute_type: int8
  tts:
    voice: it-riccardo-x-low
    speed: 1.0
  vad:
    threshold: 0.5
    min_silence_ms: 800
    debounce_ms: 500
  barge_in:
    enabled: false          # HARD DEP 16 — richiede voice_channel.enabled
  aec:
    enabled: false          # HARD DEP 17 — richiede voice_channel.enabled
  wake_word:
    enabled: false          # HARD DEP 18 — richiede voice_channel.enabled
    keyword: ""
    filter_threshold: 3
  runtime:
    adapter: claude-code
    pipe_poll_ms: 100
    pipe_timeout: 180
  pid_file_path: ~/.local/share/soli-voice/voice.pid

# Hybrid Wiki Search (v2.29, EP-042, PATTERN §31) ---------------------------
wiki_search:
  enabled: true
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
  mode: hybrid
  top_k: 5
  exclude_types: [meta]

# Capability Formativa (v2.32, EP-045) --------------------------------------
capability_formativa:
  enabled: false
  wiki_search_integration: false  # HARD DEP 20 — richiede wiki_search.enabled

# Code Intelligence Stack (v2.37, EP-054, PATTERN §33) ----------------------
# Navigazione codice local-first a 3 layer, zero SaaS.
# Invarianti: R.CI1 opt-in | R.CI2 skip per-layer | R.CI3 read-only
#             R.CI4 analysis-only | R.CI5 fallback
code_intelligence:
  enabled: true
  l1_ctags:
    enabled: true                          # universal-ctags 6.2.1 presente
    languages: [python, typescript, javascript, java, go, rust, c, cpp]
    side_channel: .ctags-state             # gitignored
    extra_flags: []
  l2_semantic:
    enabled: true                          # tree-sitter + lancedb presenti
    embedding_model: nomic-embed-code
    chunk_max_lines: 150
    lancedb_path: .code-search/index.lance # gitignored
    exclude_patterns:
      - "**/node_modules/**"
      - "**/__pycache__/**"
      - "**/vendor/**"
      - "**/*.min.js"
      - "**/*.generated.*"
      - "**/.claude/worktrees/**"
  l3_impact:
    enabled: false                         # graphify non in PATH — layer saltato (R.CI2)
    auto_run_on_dev: false
    min_symbol_confidence: 0.7

# Temporal Estimate Protocol (v2.30, EP-043, opt-in) ------------------------
temporal:
  estimate_protocol:
    enabled: true
    budget_ms:
      S: 120000
      M: 300000
      L: 600000
      XL: 1200000
    thresholds:
      warn_time_ratio: 0.8
      escalate_time_ratio: 1.0
      escalate_confidence_min: 0.5

# Refactor Skill Layer / Fleet Health (v2.41, EP-060, PATTERN §36, opt-in) --
# Rifattorizza unità di contesto agentiche (skill, agenti, indici di flotta) in
# divulgazione progressiva. Invarianti: R.FH1 opt-in | R.FH2 WARNING-only | R.FH3 fail-open.
# Skill: .claude/skills/refactor-agent-skills.md — Agent owner: fleet-doctor — Comando: /refactor
refactor_agent_skills:
  enabled: true                     # R.FH1 opt-in
  default_target: "."
  snapshot_dir: ".fleet-health/workspace"  # gitignored — baseline per rollback (V-6)
  reports_dir: ".fleet-health/reports"     # gitignored — output gate + benchmark
  thresholds:
    error: 500                      # >500 righe corpo = REFACTOR raccomandato
    warning: 300                    # 300-500 = VALUTARE
    body_target: 250                # target post-refactor
    leaf_min: 50                    # sotto = micro-foglia, anti-pattern
    leaf_max: 250                   # sopra = foglia da rifattorizzare a sua volta
  sampling:
    fan_in_floor: 5                 # PA-5 — floor min(fan_in, 5)
  injection_globs: []               # vuoto = auto-detect

# Session Agentic Analyser (v2.42, EP-061, PATTERN §37, opt-in) -------------
# Analisi critica post-hoc dell'attività agentica di sessioni Claude Code chiuse.
# Determinism-first (rilevazione via regole, LLM advisory). Solo out-of-band (R-SAA-8).
# Skill: .claude/skills/session-analysis-protocol.md — Comando: /session-analysis
session_analysis:
  enabled: true           # R-SAA-5 opt-in
  depth_default: quick    # quick|full (quick = fasi 1-3; full = anche Fase 4)
  auto_on_session_end: false  # hook SessionEnd — solo tool deterministici, mai LLM
  read_transcript: false  # L2 opt-in (fan-in EP-062 già attivo di default)
  subagents_path: ""      # override path subagents/ se non auto-discovery
  schema_version_guard: true  # R-SAA-9 obbligatorio, non disabilitabile
  anonymize_rules: [email, path, credentials]  # R-SAA-3
  max_token_budget: 1000  # bounded computation, hard cap (R-SAA-3)
